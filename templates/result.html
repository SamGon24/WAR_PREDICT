<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAR Prediction — {{ player }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 750px;">
        <div class="card shadow-lg p-4 text-center">

            <h1 class="text-success mb-1">{{ player }}</h1>
            <p class="text-muted mb-3">2025 WAR Projection</p>

            {% if player_image %}
            <div class="mb-3">
                <img src="{{ player_image }}" alt="{{ player }}"
                     class="img-thumbnail" style="max-height: 180px;">
            </div>
            {% endif %}

            <p class="fs-2 mb-1"><strong class="text-primary">{{ war }}</strong> WAR</p>

            <div class="text-muted small mb-4">
                Below average &lt; 0 &nbsp;·&nbsp;
                Average ≈ 2.0 &nbsp;·&nbsp;
                Good ≥ 3.5 &nbsp;·&nbsp;
                Elite ≥ 4.6
            </div>

            {% if war_history %}
            <div class="mt-2 mb-4">
                <canvas id="warChart" height="120"></canvas>
            </div>

            <script>
                const history     = {{ war_history | tojson }};
                const injuredYrs  = new Set({{ injured_years | tojson }});
                const predicted   = {{ war }};

                const histYears = history.map(d => d[0]);
                const histWAR   = history.map(d => d[1]);

                // Injury points overlaid in red
                const injuryPoints = history
                    .filter(d => injuredYrs.has(d[0]))
                    .map(d => ({ x: d[0], y: d[1] }));

                new Chart(document.getElementById('warChart'), {
                    type: 'line',
                    data: {
                        labels: [...histYears, 2025],
                        datasets: [
                            {
                                label: 'Historical WAR',
                                data: [...histWAR, null],
                                borderColor: '#0d6efd',
                                backgroundColor: 'rgba(13,110,253,0.08)',
                                pointRadius: 4,
                                pointBackgroundColor: histYears.map(y =>
                                    injuredYrs.has(y) ? '#dc3545' : '#0d6efd'
                                ),
                                tension: 0.3,
                                fill: true,
                            },
                            {
                                label: 'Predicted 2025',
                                data: [...Array(histYears.length).fill(null), predicted],
                                pointStyle: 'rectRot',
                                pointRadius: 8,
                                pointBackgroundColor: '#198754',
                                borderColor: 'transparent',
                                type: 'scatter',
                            },
                        ],
                    },
                    options: {
                        plugins: {
                            legend: { position: 'bottom' },
                            tooltip: {
                                callbacks: {
                                    label: ctx => ` WAR: ${ctx.parsed.y}`
                                }
                            }
                        },
                        scales: {
                            y: {
                                title: { display: true, text: 'WAR' },
                                grid: { color: 'rgba(0,0,0,0.05)' },
                            },
                            x: { grid: { display: false } },
                        },
                    },
                });
            </script>

            <div class="text-muted small">
                <span style="color:#dc3545;">●</span> Injury season &nbsp;
                <span style="color:#198754;">◆</span> 2025 projection
            </div>
            {% endif %}

            <a href="/" class="btn btn-secondary mt-4">Try another player</a>
        </div>
    </div>
</body>
</html>
